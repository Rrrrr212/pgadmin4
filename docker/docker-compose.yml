services:
  postgres-config:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pgadmin_config
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD: ${PGADMIN_CONFIG_DB_PASSWORD:-pgadmin_secret}
    volumes:
      - pgadmin_config_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgadmin -d pgadmin_config"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - pgadmin-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - pgadmin-net

  pgadmin:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      postgres-config:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@localhost}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_CONFIG_DATABASE_URI: "postgresql://pgadmin:${PGADMIN_CONFIG_DB_PASSWORD:-pgadmin_secret}@postgres-config:5432/pgadmin_config"
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_DEFAULT_SERVER: "0.0.0.0"
      PGADMIN_CONFIG_DATA_DIR: "/var/lib/pgadmin"
      PGADMIN_CONFIG_LOG_FILE: "/var/log/pgadmin/pgadmin4.log"
      PGADMIN_CONFIG_SESSION_DB_PATH: "/var/lib/pgadmin/sessions"
      PGADMIN_CONFIG_STORAGE_DIR: "/var/lib/pgadmin/storage"
      PGADMIN_CONFIG_SQLITE_PATH: "/var/lib/pgadmin/pgadmin4.db"
      PGADMIN_CONFIG_ALLOW_SAVE_PASSWORD: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_SESSION_EXPIRATION_TIME: 1
      PGADMIN_CONFIG_USER_INACTIVITY_TIMEOUT: 0
      PGADMIN_CONFIG_MAX_SESSION_IDLE_TIME: 60
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_CONFIG_CSRF_SESSION_KEY: ${PGADMIN_CSRF_SESSION_KEY:-}
      PGADMIN_CONFIG_SECRET_KEY: ${PGADMIN_SECRET_KEY:-}
      PGADMIN_CONFIG_SECURITY_PASSWORD_SALT: ${PGADMIN_SECURITY_PASSWORD_SALT:-}
      PGADMIN_CONFIG_REDIS_URL: "redis://redis:6379/0"
      PGADMIN_LISTEN_PORT: "5050"
      GUNICORN_THREADS: "25"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - pgadmin_logs:/var/log/pgadmin
    restart: unless-stopped
    networks:
      - pgadmin-net

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - pgadmin
    ports:
      - "${PGADMIN_PORT:-5051}:5051"
    volumes:
      - ./nginx/pgadmin.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - pgadmin-net

volumes:
  pgadmin_config_data:
  redis_data:
  pgadmin_data:
  pgadmin_logs:

networks:
  pgadmin-net:
    driver: bridge
