version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pgadmin-postgres
    environment:
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD: pgadmin_password
      POSTGRES_DB: pgadmin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pgadmin_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgadmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pgadmin-redis
    volumes:
      - redis_data:/data
    networks:
      - pgadmin_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pgadmin-web
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: admin_password
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_CONFIG_DATABASE_URI: "postgresql://pgadmin:pgadmin_password@postgres:5432/pgadmin"
      PGADMIN_CONFIG_REDIS_URL: "redis://redis:6379/0"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pgadmin_network

  nginx:
    image: nginx:1.25-alpine
    container_name: pgadmin-nginx
    ports:
      - "5051:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pgadmin
    networks:
      - pgadmin_network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  pgadmin_network:
    driver: bridge
