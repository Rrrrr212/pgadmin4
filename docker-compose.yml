services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgadmin_password}
      POSTGRES_DB: ${POSTGRES_DB:-pgadmin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  pgadmin:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@pgadmin.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_password}
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_CONFIG_DATABASE_URI: ${PGADMIN_CONFIG_CONFIG_DATABASE_URI:-postgresql://pgadmin:pgadmin_password@postgres:5432/pgadmin}
      PGADMIN_CONFIG_REDIS_URL: ${PGADMIN_CONFIG_REDIS_URL:-redis://redis:6379/0}
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PORT_COUNT: "1"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:5050/misc/ping | grep -q PING
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      pgadmin:
        condition: service_healthy
    ports:
      - "5051:80"
    command:
      - /bin/sh
      - -c
      - |
          cat <<'EOF' >/etc/nginx/conf.d/default.conf
          server {
            listen 80;
            server_name _;
            client_max_body_size 100m;

            location / {
              proxy_pass http://pgadmin:5050;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_set_header X-Forwarded-Host $$host;
              proxy_set_header X-Forwarded-Port $$server_port;
              proxy_connect_timeout 60s;
              proxy_send_timeout 300s;
              proxy_read_timeout 300s;
            }
          }
          EOF
          exec nginx -g 'daemon off;'

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
