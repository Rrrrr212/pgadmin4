version: '3.8'

services:
  pgadmin:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      # Configure pgAdmin via PGADMIN_CONFIG_* prefix
      - PGADMIN_CONFIG_CONFIG_DATABASE_URI=postgresql://pgadmin:pgadmin@postgres:5432/pgadmin
      - PGADMIN_CONFIG_REDIS_URL=redis://redis:6379/0
      - PGADMIN_CONFIG_CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    networks:
      - pgadmin-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=pgadmin
      - POSTGRES_PASSWORD=pgadmin
      - POSTGRES_DB=pgadmin
    volumes:
      - pgadmin-db:/var/lib/postgresql/data
    networks:
      - pgadmin-network

  redis:
    image: redis:7-alpine
    networks:
      - pgadmin-network

  nginx:
    image: nginx:alpine
    ports:
      - "5051:5051"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pgadmin
    networks:
      - pgadmin-network

volumes:
  pgadmin-db:

networks:
  pgadmin-network:
